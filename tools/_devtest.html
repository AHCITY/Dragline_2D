<!DOCTYPE html>
<!--
  _devtest.html  -  proves the cheat panel actually mounts and its actions run.

  Loads devtools.js against a stub game so the panel can be exercised headlessly.
  Dev-only; nothing in index.html or index.dev.html references this file.
-->
<html lang="en">
<head><meta charset="utf-8"><title>devtools test</title>
<style>body{background:#111;color:#ddd;font:13px monospace;margin:0;padding:10px}</style>
</head>
<body>
<pre id="out">running...</pre>
<script>
/* A game object shaped enough for the panel to read and the actions to write. */
const mkCar = (i, n) => ({ id: 'c' + i, name: n, color: '#4fc3f7', art: 's14', type: 'modern',
  x: 0, speed: 0, cash: 100, hp: 100, maxHp: 100, upgrades: {}, customization: {},
  owned: true });
window.game = {
  cash: 5000, playerCar: mkCar(1, 'S14 Drift'), ownedCars: [mkCar(1, 'S14 Drift'), mkCar(2, 'Mustang GT')],
  selectedCarIndex: 0, raceDistance: 800, raceState: 'play', state: 'play',
  upgrades: {}, stats: { races: 0, wins: 0 }, profile: { name: 'dev' },
  save: function () {}, toast: function (m) { window.__toasts = (window.__toasts || []).concat(m); },
};
</script>
<script src="../devtools.js"></script>
<script>
const out = document.getElementById('out');
const log = [];
const say = (s) => { log.push(s); out.textContent = log.join('\n'); };

say('window.DevTools present: ' + (typeof window.DevTools));

try {
  window.DevTools.open();
  const panel = document.getElementById('devtools');
  say('panel mounted: ' + !!panel);
  const secs = panel ? [...panel.querySelectorAll('details')] : [];
  say('sections: ' + secs.length + ' -> ' + secs.map(d => (d.querySelector('summary') || {}).textContent).join(' | '));
  /* Section bodies are built lazily on expand, so open them all and let the
     toggle handlers run before looking for controls. */
  secs.forEach(d => { d.open = true; });
  setTimeout(() => {
    try {
      const btns = [...panel.querySelectorAll('.dt-btn')];
      say('controls (.dt-btn) found: ' + btns.length);
      say('labels: ' + btns.map(b => b.textContent.trim()).join(' / '));
      /* Click one at a time, logging before each, so a control that blocks
         (a confirm dialog, a download, a wipe) shows up by name instead of
         hanging the whole run. */
      let i = 0;
      const step = () => {
        if (i >= btns.length) {
          say('ALL ' + btns.length + ' controls clicked without throwing');
          finish();
          return;
        }
        const b = btns[i];
        const lbl = b.textContent.trim();
        say('-> click #' + i + ' ' + lbl);
        try { b.click(); say('   ok ' + lbl); }
        catch (e) { say('   THREW ' + lbl + ': ' + e.message); }
        i++;
        setTimeout(step, 0);           /* yield so a blocking control is visible */
      };
      const finish = () => {
        say('cash after clicking everything: ' + game.cash);
        say('selected car: ' + (game.playerCar && game.playerCar.name));
        say('status line: ' + (document.getElementById('dt-status') || {}).textContent);
        window.DevTools.close();
        const p2 = document.getElementById('devtools');
        say('close() hides panel: ' + (p2 ? (getComputedStyle(p2).display === 'none' || p2.hidden) : 'removed'));
        document.title = 'devtest done';
      };
      setTimeout(step, 0);
      return;
      window.DevTools.close();
      const p2 = document.getElementById('devtools');
      say('close() hides panel: ' + (p2 ? (getComputedStyle(p2).display === 'none' || p2.hidden) : 'removed'));
      const body = document.getElementById('dt-body');
      say('--- dt-body children: ' + (body ? body.children.length : 'no #dt-body'));
      if (body) say('--- dt-body HTML (900 chars) ---\n' + body.innerHTML.slice(0, 900));
    } catch (e) { say('PASS2 THREW: ' + e.message); }
    document.title = 'devtest done';
  }, 300);
} catch (e) {
  say('THREW: ' + e.message + '\n' + e.stack);
  document.title = 'devtest done';
}
document.title = 'devtest done';
</script>
</body>
</html>
